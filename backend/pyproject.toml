[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "statistics-agent-backend"
version = "0.1.0"
description = "Local MVP backend for a statistics inquiry agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pandas>=2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pillow>=10",
  "scipy>=1.11",
  "reportlab>=4.2",
  "python-pptx>=0.6.23",
  "python-multipart>=0.0.9",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.28.1",
  "ruff>=0.4"
]

[project.optional-dependencies]
gemini = [
  "google-genai>=1.0"
]
google-cloud = [
  "firebase-admin>=6.5",
  "google-cloud-firestore>=2.16",
  "google-cloud-secret-manager>=2.20",
  "google-cloud-storage>=2.16"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
