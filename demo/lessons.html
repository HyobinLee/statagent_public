<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>정규 차시 체험</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="demo-header">
    <div class="brand">
      <a class="home" href="./">통계 에이전트</a>
      <span class="badge">체험판</span>
      <span id="track-label" class="muted"></span>
    </div>
    <div class="header-actions">
      <button type="button" id="guide-toggle" class="ghost">안내 끄기</button>
      <button type="button" id="restart" class="ghost">처음부터</button>
    </div>
  </header>

  <nav class="progress" aria-label="진행">
    <div class="progress-label" id="progress-label"></div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
  </nav>

  <main id="stage" class="stage"></main>

  <div class="nav-row" id="nav-row">
    <button type="button" id="prev" class="ghost">← 이전</button>
    <button type="button" id="next" class="primary">다음 →</button>
  </div>

  <aside id="guide" class="guide" hidden></aside>
  <div id="dialog-root"></div>

  <script src="lessons_data.js"></script>
  <script src="results.js"></script>
  <script>window.DEMO_CONFIG = { mode: "full" };</script>
  <script src="demo.js"></script>
</body>
</html>
