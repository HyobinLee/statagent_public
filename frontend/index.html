<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>통계 에이전트</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("stat-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="./css/styles.css?v=20260731-04" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html">통계 에이전트</a>
      <div class="user-strip">
        <button id="theme-toggle" type="button" data-theme-toggle></button>
        <span id="current-user"></span>
      </div>
    </header>

    <main class="entry-shell">
      <section class="entry-panel">
        <p class="eyebrow">통계 탐구 수업 지원</p>
        <h1>자료를 찾고 분석하고 보고서로 정리하는 통계 에이전트</h1>
        <p class="muted">
          학생은 탐구 질문에서 보고서까지 한 흐름으로 진행하고, 교사와 관리자는 배정된 권한에 따라 수업과 사용자를 운영합니다.
        </p>
        <div class="entry-actions">
          <button class="primary" id="entry-start">로그인하고 시작하기</button>
        </div>
        <p class="muted">처음 사용하는 학생은 로그인 후 학생 화면 오른쪽 위의 "튜토리얼" 버튼으로 연습 탐구를 시작할 수 있습니다.</p>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="./js/theme.js?v=20260731-03"></script>
    <script src="./js/state.js?v=20260731-03"></script>
    <script src="./js/api.js?v=20260731-03"></script>
    <script src="./js/auth.js?v=20260731-03"></script>
    <script>
      function syncEntryAuthState() {
        const authError = StatAuth.getAuthError?.();
        const start = document.getElementById("entry-start");
        start.disabled = Boolean(authError);
        if (StatAuth.isFirebaseMode?.() && StatAuth.isSignedIn?.()) {
          StatAuth.redirectToRoleHome();
        }
      }
      document.getElementById("entry-start").addEventListener("click", () => {
        if (StatAuth.getAuthError?.()) {
          StatApi.toast("허용된 Google 계정으로 다시 로그인해 주세요.");
          return;
        }
        if (StatAuth.isFirebaseMode?.()) {
          StatAuth.login().catch((error) => StatApi.toast(error.message));
          return;
        }
        window.location.href = StatAuth.roleHome(StatState.getRole());
      });
      window.addEventListener("stat-auth-changed", syncEntryAuthState);
      StatAuth.init()
        .then(syncEntryAuthState)
        .catch((error) => StatApi.toast(error.message));
    </script>
  </body>
</html>
