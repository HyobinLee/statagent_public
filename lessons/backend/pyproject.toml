[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "statistics-agent-lessons"
version = "0.1.0"
description = "차시별 수업 페이지 백엔드 (주 백엔드를 import로 재사용하는 샌드박스)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["lessons_app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
